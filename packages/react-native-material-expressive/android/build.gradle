def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def shouldEnableKotlinPlugin() {
    def agpMajorVersion =
        com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
    if (agpMajorVersion <= 8) {
        return true
    }
    def builtInKotlin = providers.gradleProperty("android.builtInKotlin").orNull
    return !(builtInKotlin == null ? true : builtInKotlin.toBoolean())
}

apply plugin: 'com.android.library'

if (shouldEnableKotlinPlugin()) {
    apply plugin: 'kotlin-android'
}

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

android {
    namespace "com.nasyxrakeeb.m3e"

    compileSdkVersion getExtOrDefault('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion', 24)
        targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        if (isNewArchitectureEnabled()) {
            java.directories.add("${project.buildDir}/generated/source/codegen/java")
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
