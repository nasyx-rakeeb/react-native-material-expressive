packages:
  - packages/*
  - apps/*
  - tools/*

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/react@19.3.2'
